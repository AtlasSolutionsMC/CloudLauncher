crash.error.title=OMG!
crash.error=Crash Manager has crashed O_o This is weird, right?\n\nYou can help us resolving this issue by sending the logs. To save the logs, do the following: open launcher settings, open "Legacy Launcher" tab and then select "Logger" -> "Always enabled", then "Save".\nNow you should be able to see the logs.\n\nPlease save it in the file (or Pastebin) and send us what you got: <!--<a href="https://llaun.ch/vk"></a>-->
