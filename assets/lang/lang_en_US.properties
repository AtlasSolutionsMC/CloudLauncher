account.manager.multipane.add-account-mcleaks.description.body=<img src="${image:logo-mcleaks@16.png}" width="${size:16}" height="${size:16}" />&nbsp;<b>MCLeaks.net</b> – free alt service for <img src="${image:logo-mojang@16.png}" width="${size:16}" height="${size:16}" />&nbsp;<b>Mojang</b> accounts.<br/><br/>Using an MCLeaks account you will be able to log in as a random <b>Premium</b> player, which means you can play on Premium servers.
