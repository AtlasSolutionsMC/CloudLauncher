name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install UCRT64 compiler
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Set package version from tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "Release tag is not a semantic version: $env:GITHUB_REF_NAME"
          }
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'Cargo.toml'
          $manifest = [System.IO.File]::ReadAllText($manifestPath)
          $versionLine = [System.Text.RegularExpressions.Regex]::new(
            '(?m)^version = "[^"]+"$',
            [System.Text.RegularExpressions.RegexOptions]::Multiline
          )
          $updated = $versionLine.Replace($manifest, "version = `"$version`"", 1)
          if ($updated -eq $manifest) {
            throw 'Could not set the Cargo package version from the release tag.'
          }
          [System.IO.File]::WriteAllText(
            $manifestPath,
            $updated,
            [System.Text.UTF8Encoding]::new($false)
          )
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal

      - name: Build Windows x64 package
        shell: pwsh
        run: |
          .\Scripts\build-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\Scripts\package-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path $env:GITHUB_WORKSPACE 'target\x86_64-pc-windows-gnu\release\legacylauncher-rust.exe'
          Copy-Item -LiteralPath $exe -Destination 'dist\LegacyLauncher-Rust.exe' -Force
          $names = @('LegacyLauncher-Rust.exe', 'LegacyLauncher-Rust-portable.zip')
          $lines = foreach ($name in $names) {
            $file = Join-Path $env:GITHUB_WORKSPACE "dist\$name"
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          [System.IO.File]::WriteAllLines(
            (Join-Path $env:GITHUB_WORKSPACE 'dist\SHA256SUMS.txt'),
            $lines,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/LegacyLauncher-Rust.exe
            dist/LegacyLauncher-Rust-portable.zip
            dist/SHA256SUMS.txt
